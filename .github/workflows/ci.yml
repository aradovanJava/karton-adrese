name: CI

on:
  push:
    branches: [main, "implementacija-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    name: Java – prevođenje i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (H2 + ogledni podaci + ONNX model)
        run: mvn -B -ntp verify
      - name: Izvješća testova
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-izvjesca
          path: target/surefire-reports

  ml:
    name: ML – testovi i treniranje
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: pytest
        working-directory: ml
        run: python -m pytest -q
      - name: Treniranje oglednog modela i ONNX izvoz
        working-directory: ml
        run: python -m karton_ml.treniranje --ogledni --izlaz /tmp/model

  docker:
    name: Docker Compose – PostGIS i aplikacija
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4
      - name: Pokretanje (PostGIS + ogledni podaci)
        env:
          KARTON_OGLEDNI: "true"
        run: docker compose up -d --build baza aplikacija
      - name: Čekanje na aplikaciju
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'; then echo "aplikacija radi"; exit 0; fi
            sleep 5
          done
          docker compose logs aplikacija; exit 1
      - name: Provjere API-ja nad PostGIS-om
        run: |
          set -e
          curl -fsS "http://localhost:8080/api/karton?adresa=Gorjanovi%C4%87eva%20ulica%2015" | tee /tmp/karton.json | head -c 400; echo
          grep -q "Vladimira Nazora" /tmp/karton.json
          curl -fsS "http://localhost:8080/api/okolica?lat=45.822&lon=16.006&r=800" | head -c 300; echo
          curl -fsS "http://localhost:8080/api/otvoreni-podaci/indeks15.geojson" | head -c 300; echo
          curl -fsS "http://localhost:8080/" | grep -q "Karton adrese"
          curl -fsS "http://localhost:8080/v3/api-docs" | head -c 200; echo
      - name: Zapisi
        if: always()
        run: docker compose logs --tail=200 aplikacija
